name = "mysita"
main = "src/index.ts"
compatibility_date = "2026-08-11"

# Static Assets - 静态前端文件
[assets]
directory = "./public"
binding = "ASSETS"
# API 路由先经过 Worker 处理
run_worker_first = ["/api/*"]

# R2 存储绑定 - 博客文章数据
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "md3-blog-storage"

# Rate Limiting - 防刷接口 (60 req/min per IP)
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# 环境变量
[vars]
BLOG_TITLE = "NirithyBlog"
BLOG_DESCRIPTION = "NirithyBlog on Cloudflare Workers + R2"
JWT_SECRET = "nirithy-blog-jwt-secret-2026-change-in-production"
