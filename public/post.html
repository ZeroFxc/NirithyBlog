<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post - MD3 Blog</title>
  <link rel="stylesheet" href="/css/md3.css">
</head>
<body>

  <!-- App Bar -->
  <header class="app-bar" id="appBar">
    <button class="icon-button" onclick="window.location.href='/'" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <span class="app-bar__title" data-i18n="app.title">MD3 Blog</span>
    <div class="app-bar__actions">
      <button class="lang-toggle" id="langToggle" aria-label="Switch language">
        <span id="langLabel">CN</span>
      </button>
      <button class="icon-button" id="editBtn" aria-label="Edit">
        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      </button>
      <button class="icon-button" id="deleteBtn" aria-label="Delete">
        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      </button>
      <button class="icon-button" id="themeToggle" aria-label="Toggle theme">
        <svg id="themeIconLight" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        <svg id="themeIconDark" viewBox="0 0 24 24" style="display:none"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26a5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div id="postContainer" class="post-detail">
      <div class="loading-container">
        <div class="progress-circular">
          <svg viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="20"></circle>
          </svg>
        </div>
      </div>
    </div>
  </main>

  <!-- Delete Confirmation Dialog -->
  <div class="dialog-scrim" id="deleteScrim"></div>
  <div class="dialog" id="deleteDialog">
    <h2 class="dialog__title" data-i18n="dialog.delete_title">Delete Post</h2>
    <p class="dialog__content" data-i18n="dialog.delete_content">Are you sure you want to delete this post? This action cannot be undone.</p>
    <div class="dialog__actions">
      <button class="btn-text" id="cancelDelete" data-i18n="dialog.cancel">Cancel</button>
      <button class="btn-text" id="confirmDelete" style="color: var(--md-error)" data-i18n="dialog.delete">Delete</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="blog-footer">
    <div class="blog-footer__links">
      <a href="https://github.com/ZeroFxc/myff" target="_blank" rel="noopener noreferrer" class="blog-footer__link">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        <span data-i18n="footer.open_source">Open Source</span>
      </a>
    </div>
    <p class="blog-footer__text" data-i18n="footer.powered_by">Powered by Cloudflare Workers + R2</p>
  </footer>

  <!-- Snackbar -->
  <div class="snackbar" id="snackbar">
    <span id="snackbarText"></span>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/md3.js"></script>
  <script src="/js/post.js"></script>
</body>
</html>
