<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>!function(){var t=localStorage.getItem("md3-theme");t||(t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),document.documentElement.setAttribute("data-theme",t)}();</script>
  <meta name="description" content="NirithyBlog - Material Design 3 Blog">
  <title>NirithyBlog</title>
  <link rel="stylesheet" href="/css/md3.css">
</head>
<body>

  <!-- App Bar -->
  <header class="app-bar" id="appBar">
    <button class="icon-button" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <span class="app-bar__title" id="blogTitle" data-i18n="app.title">NirithyBlog</span>
    <div class="app-bar__actions">
      <!-- Check-in Button -->
      <button class="checkin-btn" id="checkinBtn" style="display:none;" aria-label="Check-in">
        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
        <span data-i18n="checkin.checkin">Check-in</span>
      </button>
      <!-- Language Toggle -->
      <button class="lang-toggle" id="langToggle" aria-label="Switch language">
        <span id="langLabel">CN</span>
      </button>
      <!-- User Area -->
      <div id="userArea"></div>
      <!-- Theme Toggle -->
      <button class="icon-button" id="themeToggle" aria-label="Toggle theme">
        <svg id="themeIconLight" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        <svg id="themeIconDark" viewBox="0 0 24 24" style="display:none"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26a5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content fade-in">

    <!-- Search & Filter -->
    <div style="margin-bottom: 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
      <div class="text-field" style="flex: 1; min-width: 200px;">
        <input type="text" class="text-field__input" id="searchInput" data-i18n-placeholder="app.search_placeholder" placeholder="Search posts...">
      </div>
    </div>

    <!-- Category & Tag Filters -->
    <div id="filterSection" style="margin-bottom: 24px; display: flex; gap: 8px; flex-wrap: wrap;">
      <button class="chip chip--selected" data-filter="all" data-i18n="app.filter_all">All</button>
    </div>

    <!-- Posts -->
    <div id="postsContainer">
      <div class="loading-container">
        <div class="progress-circular">
          <svg viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="20"></circle>
          </svg>
        </div>
      </div>
    </div>

  </main>

  <!-- FAB -->
  <button class="fab fab--extended" id="newPostFab">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    <span data-i18n="app.new_post">New Post</span>
  </button>

  <!-- Footer -->
  <footer class="blog-footer">
    <div class="blog-footer__links">
      <a href="https://github.com/ZeroFxc/NirithyBlog" target="_blank" rel="noopener noreferrer" class="blog-footer__link">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        <span data-i18n="footer.open_source">Open Source</span>
      </a>
    </div>
    <p class="blog-footer__text" data-i18n="footer.powered_by">Powered by Cloudflare Workers + R2</p>
  </footer>

  <!-- Auth Dialog -->
  <div class="dialog-scrim" id="authScrim"></div>
  <div class="dialog" id="authDialog" style="max-width: 400px;">
    <h2 class="dialog__title" id="authDialogTitle">Login</h2>
    <div class="dialog__content" style="padding: 0 24px;">
      <div class="text-field" style="margin-bottom: 16px;">
        <label class="text-field__label">Username</label>
        <input type="text" class="text-field__input" id="authUsername" autocomplete="username" style="margin-top: 4px;">
      </div>
      <div class="text-field" style="margin-bottom: 8px;">
        <label class="text-field__label">Password</label>
        <input type="password" class="text-field__input" id="authPassword" autocomplete="current-password" style="margin-top: 4px;">
      </div>
      <p id="authError" style="color: var(--md-error); font-size: 13px; min-height: 18px; margin: 8px 0 0;"></p>
    </div>
    <div class="dialog__actions" style="flex-direction: column; align-items: stretch; gap: 8px; padding: 16px 24px 24px;">
      <button class="btn-filled" id="authSubmit" style="width: 100%;">Login</button>
      <div class="auth-divider"><span>or</span></div>
      <button class="btn-github" id="githubLoginBtn" style="width: 100%;">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.78 2.73 1.27 3.4.97.1-.75.41-1.27.74-1.56-2.55-.29-5.23-1.28-5.23-5.67 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.08 0 4.4-2.69 5.38-5.25 5.66.42.36.8 1.08.8 2.18v3.23c0 .31.21.67.8.56C20.21 21.38 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"/></svg>
        <span data-i18n="auth.login_github">Login with GitHub</span>
      </button>
      <button class="btn-text" id="authToggle" style="width: 100%; text-align: center;">No account? Register</button>
      <button class="btn-text" id="authCancel" style="width: 100%; text-align: center;" data-i18n="dialog.cancel">Cancel</button>
    </div>
  </div>

  <!-- Snackbar -->
  <div class="snackbar" id="snackbar">
    <span id="snackbarText"></span>
  </div>

  <!-- Scripts -->
  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav-drawer.js"></script>
  <script src="/js/md3.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
