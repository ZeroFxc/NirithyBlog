<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>!function(){var t=localStorage.getItem("md3-theme");t||(t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),document.documentElement.setAttribute("data-theme",t)}();</script>

  <link rel="stylesheet" href="/css/md3.css">
</head>
<body>

  <header class="app-bar" id="appBar">

    </button>

      </button>
    </div>
  </header>

  <main class="main-content fade-in">
    <div id="tagsContainer" style="max-width:800px;margin:0 auto;padding:16px;">
      <div class="loading-container"><div class="progress-circular"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="20"></circle></svg></div></div>

  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav-drawer.js"></script>
